# Velocity server name used by /lobby and /hub (must match a server in velocity.toml).
lobby-server: lobby

# Map hostname the player uses in the client (Server Address / handshake) to a Velocity server name.
# Matching is case-insensitive. If no entry matches, Velocity uses its normal default try order.
domain-servers:
  bedwars.avesclub.net: bedwars

# Shown when a player runs /discord. The link-text is clickable and opens url in the browser.
discord:
  message: "Join our Discord server!"
  link-text: "discord.gg/avesclub"
  url: "https://discord.gg/avesclub"

# Individually toggle optional features without deleting their config sections above.
# The MOTD feature's own master switch lives in motd.yml's top-level `enabled:` key,
# not here (single source of truth). Join/leave messages use join-leave-messages.enabled.
features:
  domain-routing: true
  discord-command: true
  lobby-hub-commands: true

# Proxy-side join and quit chat. A server only participates if it is listed in
# included-servers; every other server keeps its own backend messages.
# Switching between servers in the same group does not announce. An included server
# that is not listed under groups is its own group of one.
# %player% is the username. Legacy & codes and MiniMessage tags both work.
join-leave-messages:
  enabled: false
  join-message: "&8[&a+&8] &a%player%"
  quit-message: "&8[&c-&8] &c%player%"
  included-servers:
    - lobby
    - survival
    - survival-nether
  groups:
    survival:
      - survival
      - survival-nether

# Shared online count across proxies (for example a Java proxy and a Geyser/Bedrock proxy).
# Each proxy writes its own player count to Redis; the server-list ping on every proxy shows
# the sum. This changes the numeric online count and <online> in motd.yml. <max> and
# <online_SERVERNAME> are not changed. A profile's online-override in motd.yml still wins.
# Give every proxy the same redis settings and a different proxy-id.
network-players:
  enabled: false
  redis:
    host: 127.0.0.1
    port: 6379
    # ACL user that only needs: +set +get +scan +ping on ~avesclub:players:*
    username: ""
    password: ""
    # Anything other than 0 also needs +select in the ACL.
    database: 0
    # TLS off
  # Stable id for THIS proxy. Must be unique per proxy. Examples: java, bedrock
  proxy-id: java
  # How often this proxy writes its own count.
  publish-interval-seconds: 3
  # Key TTL. If a proxy dies, its count disappears instead of sticking. Must be greater than the interval.
  key-ttl-seconds: 10
  key-prefix: "avesclub:players:"
